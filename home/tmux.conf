set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind r source-file ~/.tmux.conf

set -g base-index 1

# Pane splits
bind | split-window -h
bind - split-window -v

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Session switching
bind H switch-client -p
bind L switch-client -n

# Resize panes with arrow keys
bind Up resize-pane -U 5
bind Down resize-pane -D 5
bind Left resize-pane -L 5
bind Right resize-pane -R 5

set -g default-terminal "ghostty"
set -sg escape-time 0
set -g history-limit 50000
set -ga terminal-overrides ",*:Tc"

set -g status-style bg=black,fg=lightblue
set -g status-left "#S "
set -g status-right "#H"
set -g window-status-current-style bg=black,fg=lightblue
set -g window-status-style bg=black,fg=lightblue
set -g mouse on

# Vim keys in copy mode
setw -g mode-keys vi
